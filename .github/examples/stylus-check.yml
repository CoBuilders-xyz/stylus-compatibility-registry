# Copy into YOUR project's .github/workflows/stylus-check.yml.
name: Stylus dependency review

on: [push, pull_request]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install the beta CLI and matching registry
        shell: bash
        run: |
          cargo install stylus-registry --version 0.1.0-beta.1 --locked
          release=https://github.com/CoBuilders-xyz/stylus-compatibility-registry/releases/download/v0.1.0-beta.1
          archive=stylus-registry-data-v0.1.0-beta.1.tar.gz
          mkdir -p .stylus-registry
          cd .stylus-registry
          curl --fail --location --remote-name "$release/$archive"
          curl --fail --location --remote-name "$release/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "$archive"
      - name: Analyze project dependencies
        run: >-
          stylus-registry check-deps
          --manifest Cargo.toml
          --data-dir .stylus-registry/stylus-registry-data-v0.1.0-beta.1/data
          --include-transitive
          --strict
